# /etc/nginx/sites-available/phillyphilly — installed by deploy/server-setup.sh.
# certbot adds the HTTPS listener and the http -> https redirect to this block.

map $uri $phillyphilly_cache {
    ~*\.(webp|jpe?g|png|svg|gif|ico|woff2?)$  "public, max-age=31536000, immutable";
    ~*\.(css|js)$                             "public, max-age=86400";
    ~*\.json$                                 "public, max-age=300";
    default                                   "no-cache";
}

# Trading calendar: the public Google Calendar feed, cached for 5 minutes so a
# busy page never hits Google more than that.
proxy_cache_path /var/cache/nginx/phillyphilly-calendar levels=1 keys_zone=phillyphilly_calendar:1m max_size=10m inactive=1d;

server {
    listen 80;
    listen [::]:80;
    server_name phillyphilly.co.uk www.phillyphilly.co.uk;

    root /var/www/phillyphilly;
    index index.html;

    if ($host = www.phillyphilly.co.uk) {
        return 301 $scheme://phillyphilly.co.uk$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $phillyphilly_cache always;

    # The web root is a git checkout; keep .git and other dotfiles private.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Old single-page URLs -> new structure. Keeps any existing links, QR codes
    # and Instagram bio links working, and passes ranking signals on.
    location = /index.html     { if ($request_uri ~ ^/index\.html) { return 301 /; } }
    location = /gallery.html   { return 301 /gallery/; }
    location = /calendar.html  { return 301 /find-us/; }
    location = /admin.html     { return 301 /admin/; }

    # Convenience shortcuts (worth putting on flyers and business cards)
    location ~ ^/(quote|book)/?$             { return 301 /contact/; }
    location ~ ^/wedding/?$                  { return 301 /weddings/; }
    location ~ ^/allergens/?$                { return 301 /menu/#allergens; }
    location ~ ^/(party|private-events)/?$   { return 301 /private-parties/; }
    location ~ ^/christmas/?$                { return 301 /christmas-party-catering/; }
    location ~ ^/prices/?$                   { return 301 /food-truck-hire-cost/; }

    # Google Calendar -> /api/calendar.ics (read by assets/js/main.js). Replace
    # the ID with the calendar's "Calendar ID" from Google Calendar settings.
    # Until then Google answers 404 and the site falls back to data/events.json.
    location = /api/calendar.ics {
        set $phillyphilly_calendar_id "TODO-CLIENT-CALENDAR-ID";
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://calendar.google.com/calendar/ical/$phillyphilly_calendar_id/public/basic.ics;
        proxy_ssl_server_name on;
        proxy_set_header Host calendar.google.com;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_cache phillyphilly_calendar;
        proxy_cache_valid 200 5m;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
