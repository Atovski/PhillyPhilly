name: Deploy

# Builds the site and publishes dist/ to the `deploy` branch. The server pulls
# that branch every couple of minutes (see deploy/server-setup.sh), so no server
# credentials ever live in GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # build.js only uses Node built-ins, so no npm install is needed.
      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: Build
